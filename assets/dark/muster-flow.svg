  </defs>
  <rect x="0.5" y="0.5" width="639" height="229" rx="14" fill="#0b1220" stroke="#1e293b"/>
  <text x="18" y="22" font-family="ui-sans-serif,-apple-system,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#8b98b1" letter-spacing="1.2">HOW IT WORKS</text>

  
    <rect x="18" y="72" width="112" height="48" rx="12" fill="#111a2e" stroke="#1e293b"/>
