    <text x="600" y="150" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="19" fill="#ccfbf1">ML intern at FlyRank AI  ·  ICS student, Lahore, Pakistan</text>
