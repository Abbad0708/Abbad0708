<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-label="Muhammad Abbad Ur Rehman. ML intern at FlyRank AI, ICS student in Lahore, Pakistan.">
  <defs>
