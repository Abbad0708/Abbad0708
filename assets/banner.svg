<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Muhammad Abbad ur Rehman, Computer Science student who builds developer tools">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/><stop offset="0.6" stop-color="#0f1b33"/><stop offset="1" stop-color="#0b2a2f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop offset="0" stop-color="#14b8a6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6"><stop offset="0" stop-color="#14b8a6" stop-opacity="0.22"/><stop offset="1" stop-color="#14b8a6" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" opacity="0.06"/></pattern>
    <clipPath id="r"><rect width="1200" height="320" rx="16"/></clipPath>
    <linearGradient id="markGrad" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#14b8a6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#dots)"/>
    <rect width="1200" height="320" fill="url(#glow)"/>
    <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>

    <!-- name block -->
    
  <g transform="translate(64 50) scale(0.9166666666666666)">
    <rect width="48" height="48" rx="13" fill="#0b1220" stroke="#1e293b"/>
    <path d="M14 36 L24 11 L34 36" fill="none" stroke="url(#markGrad)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M18.5 27.5h11" stroke="#e5eaf3" stroke-width="3.2" stroke-linecap="round"/>
    <circle cx="24" cy="11" r="2.6" fill="#22d3ee"/>
  </g>
    <text x="120" y="82" font-family="ui-monospace,'Cascadia Code','Fira Code',Consolas,'Liberation Mono',monospace" font-size="13" fill="#8b98b1" letter-spacing="1.5">ABBAD0708</text>
    <text x="64" y="138" font-family="ui-sans-serif,-apple-system,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="40" font-weight="700" fill="#e5eaf3" letter-spacing="-0.5">Muhammad Abbad ur Rehman</text>
    <rect x="64" y="148" width="0" height="4" rx="2" fill="url(#accent)"><animate attributeName="width" from="0" to="120" dur="0.8s" begin="0.2s" fill="freeze"/></rect>
    <text x="64" y="192" font-family="ui-sans-serif,-apple-system,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="21" fill="#8b98b1">Computer Science student  ·  builds small, self-hosted developer tools</text>
    <text x="64" y="236" font-family="ui-monospace,'Cascadia Code','Fira Code',Consolas,'Liberation Mono',monospace" font-size="15" fill="#14b8a6">LLM tooling   ·   Node.js   ·   local-first apps   ·   learning in public</text>

    <!-- terminal -->
    <g transform="translate(752 52)">
      <rect width="400" height="196" rx="12" fill="#111a2e" stroke="#1e293b"/>
      <rect width="400" height="34" rx="12" fill="#172036"/><rect y="22" width="400" height="12" fill="#172036"/>
      <circle cx="20" cy="17" r="5" fill="#f87171"/><circle cx="38" cy="17" r="5" fill="#fbbf24"/><circle cx="56" cy="17" r="5" fill="#34d399"/>
      <text x="200" y="22" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','Fira Code',Consolas,'Liberation Mono',monospace" font-size="12" fill="#8b98b1">abbad@dev — muster</text>
      
    <text x="36" y="64" font-family="ui-monospace,'Cascadia Code','Fira Code',Consolas,'Liberation Mono',monospace" font-size="15" opacity="0">
      <tspan fill="#8b98b1">$ </tspan><tspan fill="#e5eaf3">npm start</tspan>
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.6s" fill="freeze"/>
    </text>
    <text x="36" y="94" font-family="ui-monospace,'Cascadia Code','Fira Code',Consolas,'Liberation Mono',monospace" font-size="15" opacity="0">
      <tspan fill="#14b8a6"></tspan><tspan fill="#14b8a6">muster listening on localhost:3000</tspan>
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.05s" fill="freeze"/>
    </text>
    <text x="36" y="124" font-family="ui-monospace,'Cascadia Code','Fira Code',Consolas,'Liberation Mono',monospace" font-size="15" opacity="0">
      <tspan fill="#8b98b1"></tspan><tspan fill="#8b98b1">12 providers · 4 adapters · 0 build steps</tspan>
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.5s" fill="freeze"/>
    </text>
    <text x="36" y="154" font-family="ui-monospace,'Cascadia Code','Fira Code',Consolas,'Liberation Mono',monospace" font-size="15" opacity="0">
      <tspan fill="#8b98b1">$ </tspan><tspan fill="#e5eaf3">git push origin main</tspan>
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.9500000000000002s" fill="freeze"/>
    </text>
      <rect x="36" y="172" width="9" height="16" fill="#14b8a6"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></rect>
    </g>
  </g>
</svg>
